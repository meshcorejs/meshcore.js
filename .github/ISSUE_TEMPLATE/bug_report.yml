name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Radio replies and console output help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      placeholder: "@meshcorejs/client 0.1.0, Node 22.12, Companion firmware 1.9.0, Linux"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A bot or a test with `@meshcorejs/testing` that shows the problem.
      render: ts
